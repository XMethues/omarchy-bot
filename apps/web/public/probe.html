<!doctype html><html><body><div id=out>pending</div>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const r = await fetch('/api/bots', {headers: {'x-command-id': crypto.randomUUID()}});
    const d = await r.json();
    out.textContent = 'FETCH_OK ' + d.length + ' pi=' + (d.find(b=>b.id==='pi')?.status ?? 'none');
  } catch (e) { out.textContent = 'FETCH_ERR ' + e; }
})();
</script></body></html>
